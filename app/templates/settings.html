{% extends "base.html" %}{% block title %}Suchprofil · Berlin Job Radar{% endblock %}
{% block content %}
<section class="page-head"><div><p class="eyebrow">KONFIGURATION</p><h1>Suchprofil</h1></div></section>
<form id="settings-form" class="settings">
<label>Standort<input id="location"></label><label>Radius (km)<input id="radius_km" type="number"></label>
<label>Anstellungsart<div class="sources-grid"><label class="checkbox"><input type="checkbox" name="employment_types" value="Werkstudent">Werkstudent</label><label class="checkbox"><input type="checkbox" name="employment_types" value="Vollzeit">Vollzeit</label><label class="checkbox"><input type="checkbox" name="employment_types" value="Teilzeit">Teilzeit</label><label class="checkbox"><input type="checkbox" name="employment_types" value="Praktikum">Praktikum</label></div></label><label>Stunden min.<input id="hours_min" type="number"></label><label>Stunden max.<input id="hours_max" type="number"></label><label>Scanintervall (Min.)<input id="scan_interval_minutes" type="number"></label>
<label>Zielpositionen <textarea id="target_roles" placeholder="z. B. Data Analytics, Risk Management, Finance"></textarea></label><label>Skills <textarea id="skills" placeholder="z. B. Python, SQL, Excel, Power BI"></textarea></label><label>Zusätzliche Keywords <textarea id="keywords"></textarea></label><label>Ausschlüsse <textarea id="exclusions"></textarea></label><label>Remote-Typen <input id="remote_types"></label>
<label>Jobportale
<div id="sources" class="sources-grid">
<label class="checkbox"><input type="checkbox" name="sources" value="stepstone">StepStone</label>
<label class="checkbox"><input type="checkbox" name="sources" value="indeed">Indeed</label>
<label class="checkbox"><input type="checkbox" name="sources" value="linkedin">LinkedIn</label>
<label class="checkbox"><input type="checkbox" name="sources" value="xing">Xing</label>
<label class="checkbox"><input type="checkbox" name="sources" value="monster">Monster</label>
<label class="checkbox"><input type="checkbox" name="sources" value="jobware">Jobware</label>
<label class="checkbox"><input type="checkbox" name="sources" value="kimeta">Kimeta</label>
<label class="checkbox"><input type="checkbox" name="sources" value="arbeitsagentur">Arbeitsagentur</label>
<label class="checkbox"><input type="checkbox" name="sources" value="generic">Generisch (freie Suche)</label>
</div>
</label>
<div><button class="primary" type="submit">Speichern</button><span id="saved"></span></div>
</form>
{% endblock %}
